name: repost-telegraph

on:
  workflow_dispatch:
    inputs:
      kind:
        description: '重发类型'
        required: true
        type: choice
        options:
          - asset-version
          - master-data
      target:
        description: 'asset-version: 版本号 (如 12491) / master-data: 文件夹名 (如 2026_07_08_16_00_00);留空 = 最新'
        required: false
        default: ''

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  repost:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_DATA_BUCKET: ${{ vars.R2_DATA_BUCKET }}
      BXB_MASTER_TABLES: ${{ github.workspace }}/mt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pull baseline
        run: python update/r2_state.py pull

      - name: Resolve master_data target + regenerate changelog
        if: ${{ inputs.kind == 'master-data' }}
        run: |
          NEW="${{ inputs.target }}"
          cd mt/master_data
          LIST=$(ls -d */ | tr -d / | grep -E '^[0-9]{4}_' | sort)
          [ -z "$NEW" ] && NEW=$(echo "$LIST" | tail -1)
          if ! echo "$LIST" | grep -qx "$NEW"; then echo "master_data/$NEW 不存在"; exit 1; fi
          OLD=$(echo "$LIST" | grep -x -B1 "$NEW" | head -1)
          if [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then echo "$NEW 无前置快照"; exit 1; fi
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          if [ -f "$OLD/_index.json" ] && [ -f "$NEW/_index.json" ]; then
            cd "$GITHUB_WORKSPACE"
            python update/diff_master_tables.py "$OLD" "$NEW" \
              --root mt/master_data --out "mt/master_data/$NEW/changelog.md"
          else
            echo "::notice::$OLD / $NEW 不在完整基准里 (R2 只留最新两份完整快照)、沿用已存 changelog.md"
          fi

      - name: Repost master_data changelog (editPage 原地更新)
        if: ${{ inputs.kind == 'master-data' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        run: python update/notify.py master_data "$NEW"

      - name: Repost asset_version 图册 (合成图 + editPage 原地更新)
        if: ${{ inputs.kind == 'asset-version' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: python update/notify.py asset_version "${{ inputs.target }}"

      - name: Push baseline
        run: python update/r2_state.py push
